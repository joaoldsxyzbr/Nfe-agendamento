name: Atualizar dependencias da extensao (uso unico)

on:
  push:
    branches: [nfe-agendamento]
    paths: [.github/workflows/refresh-extension-lock.yml]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'joaoldsxyzbr/Nfe-agendamento-2.0' && github.ref == 'refs/heads/nfe-agendamento'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Remover Wrangler do workspace de UI e atualizar lockfile
        run: |
          npm uninstall --workspace @nfe-agendamento/web --save-dev wrangler
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Instalar de forma reproduzivel
        run: npm ci
      - name: Conferir extensao sem backend
        run: |
          npm run test:extension
          npm run build:extension
      - name: Gravar lockfile validado somente na branch de teste
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/nfe-agendamento'
          rm -f .github/workflows/refresh-extension-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json package-lock.json .github/workflows/refresh-extension-lock.yml
          git diff --cached --check
          git commit -m "chore(deps): remover Wrangler e regenerar lockfile do app MV3"
          git push origin HEAD:nfe-agendamento
