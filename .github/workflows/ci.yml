name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lockfile for security fixes (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const original = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          const updated = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changed = {};
          const removed = [];
          for (const key of new Set([...Object.keys(original.packages), ...Object.keys(updated.packages)])) {
            if (!(key in updated.packages)) removed.push(key);
            else if (JSON.stringify(updated.packages[key]) !== JSON.stringify(original.packages[key])) changed[key] = updated.packages[key];
          }
          console.log('LOCKFILE_PATCH_START');
          console.log(JSON.stringify({changed, removed, metadata: {name: updated.name, version: updated.version, lockfileVersion: updated.lockfileVersion, requires: updated.requires}}));
          console.log('LOCKFILE_PATCH_END');
          NODE
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:web
      - run: npm run format:check:web
      - run: npm run test:web
      - run: npm run coverage:web
      - run: npm run build:web
      - run: ./node_modules/.bin/wrangler deploy --dry-run

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:extension
      - run: npm run coverage:extension
      - run: npm run build:extension

  danfe-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/playwright
      - run: npm audit --prefix tests/playwright --audit-level=high
      - run: tests/playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate and validate browser/DANFE flows
        run: npm test --prefix tests/playwright
