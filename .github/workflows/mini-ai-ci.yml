name: Mini-IA P1 - treinamento e extensão

on:
  push:
    branches: ['feat/nfe-mini-ia-*']
  pull_request:
    branches: [nfe-agendamento]

permissions:
  contents: read

concurrency:
  group: mini-ia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validar treinamento reprodutível e métricas sintéticas
        run: node scripts/train-mini-ai.mjs --check
      - run: npm run test:extension
      - run: npm run coverage:extension
      - run: npm run build:extension
      - name: Conferir pacote MV3
        run: |
          test -s apps/extension/dist/app.html
          test -s apps/extension/dist/background.js
          test -s apps/extension/dist/portal-content.js
          test -s apps/extension/dist/options.js
          node -e 'const m=require("./apps/extension/dist/manifest.json"); if(m.host_permissions.some(h=>h.includes("joaolds.xyz.br"))) process.exit(1)'
